name: Translate Documentation

on:
  push:
    branches:
      - master

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send translation request
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BRANCHNAME="master"
          SOURCE_FOLDER="en/"
          TARGET_FOLDER=""
          # Must list every locale the site builds, or a published locale silently stops tracking
          # English: its pages keep the wording they had when they were last translated while the
          # English source moves on. The ten added here are already present in the repository and are
          # now built and served, so they need to stay in sync from this point on.
          LANGUAGES='["ar", "de", "es", "fr", "ja", "ru", "zh", "fa", "ko", "it", "zh-hant", "vi", "pt", "tr", "pl", "id", "th"]'

          echo "==== Translation Request Parameters ===="
          echo "Base SHA:      $BASE_SHA"
          echo "Head SHA:      $HEAD_SHA"
          echo "Repository Owner: $REPO_OWNER"
          echo "Repository:    $REPO"
          echo "Source Folder: $SOURCE_FOLDER"
          echo "Target Folder: $TARGET_FOLDER"
          echo "Languages:     $LANGUAGES"
          echo "========================================"

          curl -X POST "https://api.aspose.ai/slides-internal/documentation-translator/translate-documentation" \
            -H "Content-Type: application/json" \
            -d "{
              \"baseSha\": \"$BASE_SHA\",
              \"headSha\": \"$HEAD_SHA\",
              \"repoOwner\": \"$REPO_OWNER\",
              \"repo\": \"$REPO\",
              \"branchName\": \"$BRANCHNAME\",
              \"sourceFolder\": \"$SOURCE_FOLDER\",
              \"targetFolder\": \"$TARGET_FOLDER\",
              \"languages\": $LANGUAGES
            }"

