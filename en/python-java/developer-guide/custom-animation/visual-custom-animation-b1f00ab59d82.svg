<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 505">
<title id="title">A cubic curve has two control points</title>
<desc id="description">An original straight segment is compared with its replacement cubic curve, whose two controls are not destinations.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">A cubic curve has two control points</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">CONCEPTUAL DIAGRAM</text>
<path d="M80 150 L280 150 L480 280 L680 280" fill="none" stroke="#cedaea" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M80 150 H580" fill="none" stroke="#b6501e" stroke-width="3"/>
<circle cx="580" cy="150" r="6" fill="#b6501e"/>
<text x="390" y="112" font-size="17" font-weight="normal" text-anchor="start" fill="#b6501e">Original LineTo: (0.25, 0)</text>
<path d="M80 150 C280 150 480 280 680 280" fill="none" stroke="#275eb0" stroke-width="5"/>
<circle cx="80" cy="150" r="8" fill="#275eb0"/>
<circle cx="280" cy="150" r="8" fill="#04776f"/>
<circle cx="480" cy="280" r="8" fill="#04776f"/>
<circle cx="680" cy="280" r="8" fill="#275eb0"/>
<text x="26" y="105" font-size="17" font-weight="normal" text-anchor="start" fill="#275eb0">Start (0, 0)</text>
<text x="200" y="210" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Control 1</text>
<text x="200" y="234" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">(0.1, 0)</text>
<text x="388" y="330" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Control 2</text>
<text x="388" y="354" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">(0.2, 0.1)</text>
<text x="606" y="330" font-size="17" font-weight="normal" text-anchor="start" fill="#275eb0">End</text>
<text x="606" y="354" font-size="17" font-weight="normal" text-anchor="start" fill="#275eb0">(0.3, 0.1)</text>
<text x="26" y="435" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">Orange: original straight segment. Blue: replacement curve.</text>
<text x="26" y="459" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">Dashed handles connect control points, not successive destinations.</text>
</g>
</svg>
