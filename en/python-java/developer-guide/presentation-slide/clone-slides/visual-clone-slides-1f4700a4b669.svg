<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 1390">
<title id="title">Cloning preserves shape coordinates</title>
<desc id="description">Three real renders at the same scale show clipping on a smaller destination canvas and a size-matched destination.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Cloning preserves shape coordinates</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL OUTPUT • SAME SCALE FOR ALL THREE CANVASES</text>
<text x="40" y="105" font-size="20" font-weight="bold" text-anchor="start" fill="#275eb0">Source: 720 × 405 pt</text>
<svg x="40" y="120" width="576.0" height="324" viewBox="0 0 720 405"><image width="720" height="405" href="data:image/png;base64,"/></svg>
<rect x="40" y="120" width="576.0" height="324" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="515" font-size="20" font-weight="bold" text-anchor="start" fill="#04776f">Destination: 540 × 405 pt</text>
<svg x="40" y="530" width="432.0" height="324" viewBox="0 0 540 405"><image width="540" height="405" href="data:image/png;base64,"/></svg>
<rect x="40" y="530" width="432.0" height="324" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<rect x="440" y="690" width="128" height="80" rx="0" fill="none" stroke="#b6501e" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="40" y="891" font-size="17" font-weight="normal" text-anchor="start" fill="#b6501e">Dashed: stored frame extends beyond the smaller canvas.</text>
<text x="40" y="925" font-size="20" font-weight="bold" text-anchor="start" fill="#04776f">Matched destination: 720 × 405 pt</text>
<svg x="40" y="940" width="576.0" height="324" viewBox="0 0 720 405"><image width="720" height="405" href="data:image/png;base64,"/></svg>
<rect x="40" y="940" width="576.0" height="324" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="1370" font-size="18" font-weight="normal" text-anchor="start" fill="#40536b">Every clone retains the frame (500, 200), 160 × 100 pt.</text>
</g>
</svg>
