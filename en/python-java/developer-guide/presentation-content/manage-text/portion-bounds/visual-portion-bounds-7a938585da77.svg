<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 404">
<title id="title">Starting coordinates of text portions</title>
<desc id="description">Measured points mark the starts of Sales and Q3. The highlighted rectangles show their layout bounds.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<defs><marker id="14253d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#14253d"/></marker><marker id="275eb0-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#275eb0"/></marker><marker id="04776f-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#04776f"/></marker><marker id="b6501e-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b6501e"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<image x="37.38" y="141.38" width="685.99" height="166.52" href="data:image/png;base64,"/>
<circle cx="41" cy="145" r="5.5" fill="#b6501e" stroke="#fff" stroke-width="1.5"/>
<text x="30" y="122" text-anchor="start" font-size="27" fill="#b6501e" font-weight="700">Shape origin (0, 0)</text>
<rect x="237.385" y="159.48" width="199.1" height="78.192" rx="0" fill="none" stroke="#275eb0" stroke-width="3" stroke-dasharray="8 5"/>
<circle cx="237.385" cy="159.48" r="5.5" fill="#275eb0" stroke="#fff" stroke-width="1.5"/>
<text x="40" y="351" text-anchor="start" font-size="29" fill="#275eb0" font-weight="700">Sales starts at</text>
<text x="40" y="383" text-anchor="start" font-size="27" fill="#14253d">(108.5, 8.0) pt</text>
<rect x="436.485" y="159.48" width="86.88" height="78.192" rx="0" fill="none" stroke="#04776f" stroke-width="3"/>
