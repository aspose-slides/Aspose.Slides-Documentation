<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 470">
<title id="title">Choose for the deployed environment</title>
<desc id="description">Target framework, operating system and architecture determine the package and native requirements, followed by testing with deployment fonts.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Choose for the deployed environment</text>
<text x="26" y="61" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">CONCEPTUAL DIAGRAM</text>
<rect x="154" y="88" width="452" height="80" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="170" y="117" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Start with the application target</text>
<text x="170" y="146" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Framework + operating system + architecture</text>
<path d="M270,170 L200,212" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="200.0,212.0 204.9,204.5 209.0,211.2" fill="#275eb0"/>
<path d="M490,170 L560,212" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="560.0,212.0 551.0,211.2 555.1,204.5" fill="#275eb0"/>
<rect x="26" y="220" width="337" height="153" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="42" y="249" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Standard package</text>
<text x="42" y="278" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Use its documented graphics setup.</text>
<text x="42" y="301" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">On Linux: libgdiplus and the</text>
<text x="42" y="324" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">documented Unix support setting.</text>
<text x="42" y="347" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Install appropriate fonts.</text>
<rect x="397" y="220" width="337" height="153" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="413" y="249" font-size="18" font-weight="bold" text-anchor="start" fill="#04776f">Cross-platform package</text>
<text x="413" y="278" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Use the matching platform build.</text>
<text x="413" y="301" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">On Linux: fontconfig plus the</text>
<text x="413" y="324" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">required native runtime.</text>
<text x="413" y="347" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Install appropriate fonts.</text>
<path d="M194,376 L320,409" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="320.0,409.0 311.2,410.7 313.2,403.2" fill="#275eb0"/>
<path d="M565,376 L440,409" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="440.0,409.0 446.8,403.1 448.8,410.7" fill="#275eb0"/>
<text x="380" y="438" font-size="18" font-weight="bold" text-anchor="middle" fill="#14253d">Verify rendering on the actual deployment target.</text>
</g>
</svg>
