<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<image x="30" y="102" width="434.75" height="207.2" href="data:image/png;base64,"/>
<line x1="281.449" y1="147.14" x2="472" y2="147.14" stroke="#275eb0" stroke-width="2"/>
<text x="487" y="144.14" text-anchor="start" font-size="28" fill="#14253d" font-weight="700">Depth 0</text>
<text x="487" y="171.14" text-anchor="start" font-size="25" fill="#40536b">25 pt left margin</text>
<line x1="458.355" y1="200.42" x2="472" y2="200.42" stroke="#275eb0" stroke-width="2"/>
<text x="487" y="197.42" text-anchor="start" font-size="28" fill="#14253d" font-weight="700">Depth 1</text>
<text x="487" y="224.42" text-anchor="start" font-size="25" fill="#40536b">50 pt left margin</text>
<line x1="346.661" y1="253.7" x2="472" y2="253.7" stroke="#275eb0" stroke-width="2"/>
