<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 410">
<title id="title">Three levels of editable bullets</title>
<desc id="description">Planning, Implementation and Review step right at depths zero through two.</desc>
