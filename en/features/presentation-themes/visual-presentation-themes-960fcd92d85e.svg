<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 1144.2857142857142">
<title id="title">A theme-linked fill follows Accent 4</title>
<desc id="description">Equally cropped renders from a controlled fixture show the labelled stages.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">A theme-linked fill follows Accent 4</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL OUTPUT • ILLUSTRATIVE .NET 26.11 FIXTURE</text>
<text x="40" y="105.0" font-size="19" font-weight="bold" text-anchor="start" fill="#275eb0">Before: original Accent 4</text>
<svg x="40" y="120.0" width="680" height="437.14285714285717" viewBox="60 60 280 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="120.0" width="680" height="437.14285714285717" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="602.1428571428571" font-size="19" font-weight="bold" text-anchor="start" fill="#04776f">After: Accent 4 set to orange</text>
<svg x="40" y="617.1428571428571" width="680" height="437.14285714285717" viewBox="60 60 280 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="617.1428571428571" width="680" height="437.14285714285717" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="1100.2857142857142" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">The rectangle keeps its Accent4 reference and the same geometry.</text>
