<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 350">
<title id="title">Move a group while keeping its editable children</title>
<desc id="description">The same two named rectangles appear inside the original group frame and the moved group frame. A legend distinguishes offsets from the group top-left from the group&#x27;s slide position.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="28" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Original group</text>
<image x="28.000" y="50.000" width="302.600" height="222.500" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="28.000" y="50.000" width="302.600" height="222.500" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<rect x="45.800" y="67.800" width="178.000" height="53.400" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray="5 4" rx="0" opacity="1"/>
<text x="81.8" y="98.8" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Left item</text>
<text x="188.8" y="98.8" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Right item</text>
<text x="28" y="303" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Group frame (20, 20, 200, 60) pt</text>
<text x="411" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Moved group</text>
<image x="411.000" y="50.000" width="302.600" height="222.500" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="411.000" y="50.000" width="302.600" height="222.500" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<rect x="500.000" y="192.400" width="178.000" height="53.400" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray="5 4" rx="0" opacity="1"/>
<text x="536.0" y="223.4" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Left item</text>
<text x="643.0" y="223.4" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Right item</text>
<text x="411" y="303" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Group frame (100, 160, 200, 60) pt</text>
<text x="29" y="335" font-size="17" font-weight="400" text-anchor="start" fill="#40536b">Left item starts 0 pt and Right item starts 120 pt from the group’s left edge.</text>
</g>
</svg>
