<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 340">
<title id="title">Parts of an editable math fraction</title>
<desc id="description">The rendered fraction x squared over y is linked to the numerator and denominator in the equation tree.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<defs><marker id="14253d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#14253d"/></marker><marker id="275eb0-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#275eb0"/></marker><marker id="04776f-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#04776f"/></marker><marker id="b6501e-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b6501e"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<image x="107" y="86" width="111.3" height="228.9" href="data:image/png;base64,"/>
<text x="324" y="98" text-anchor="start" font-size="31" fill="#275eb0" font-weight="700">Fraction with bar</text>
<line x1="337" y1="119" x2="337" y2="260" stroke="#275eb0" stroke-width="3"/>
<line x1="337" y1="152" x2="362" y2="152" stroke="#275eb0" stroke-width="3"/>
<text x="376" y="161" text-anchor="start" font-size="25" fill="#14253d" font-weight="700">Numerator · x²</text>
<line x1="337" y1="254" x2="362" y2="254" stroke="#275eb0" stroke-width="3"/>
<text x="376" y="263" text-anchor="start" font-size="25" fill="#14253d" font-weight="700">Denominator · y</text>
<text x="376" y="199" text-anchor="start" font-size="25" fill="#04776f">Base x, superscript 2</text>
</g>
</svg>
