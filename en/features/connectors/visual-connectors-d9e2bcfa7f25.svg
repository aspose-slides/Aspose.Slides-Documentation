<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 292">
<title id="title">Rerouting an attached elbow connector</title>
<desc id="description">Two renders compare the same connector before and after the End rectangle moves down. Dots mark the connection sites on the facing edges.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="28" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Before moving End</text>
<image x="28.000" y="53.000" width="332.000" height="215.190" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="28.000" y="53.000" width="332.000" height="215.190" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<circle cx="138.66666666666669" cy="126.77777777777777" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<circle cx="249.33333333333334" cy="126.77777777777777" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<text x="101.77777777777777" y="131.77777777777777" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Start</text>
<text x="286.22222222222223" y="131.77777777777777" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">End</text>
<text x="400" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">After moving and rerouting</text>
<image x="400.000" y="53.000" width="332.000" height="215.190" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="400.000" y="53.000" width="332.000" height="215.190" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<circle cx="510.6666666666667" cy="126.77777777777777" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<circle cx="621.3333333333334" cy="225.14814814814815" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<text x="473.77777777777777" y="131.77777777777777" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">Start</text>
<text x="658.2222222222222" y="230.14814814814815" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">End</text>
</g>
</svg>
