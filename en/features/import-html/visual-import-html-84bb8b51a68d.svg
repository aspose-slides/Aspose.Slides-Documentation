<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 680 829">
<title id="title">HTML heading and bold text</title>
<desc id="description">Browser crop of Quarterly report and Revenue is growing, followed by the same heading and bold word in the actual imported slide. A separate table example shows a slide-level table and cell text flattened into a text frame.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="24" y="44" font-size="34" font-weight="700" fill="#14253d" text-anchor="start">HTML heading and bold text</text>
<text x="24" y="92" font-size="27" font-weight="700" fill="#275eb0" text-anchor="start">HTML in the browser</text>
<image x="24" y="110" width="632" height="181.939" href="data:image/png;base64,"/>
<rect x="24" y="110" width="632" height="181.939" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<text x="24" y="333" font-size="27" font-weight="700" fill="#275eb0" text-anchor="start">Imported PowerPoint slide · detail</text>
<image x="24" y="353" width="632" height="153.212" href="data:image/png;base64,"/>
<rect x="24" y="353" width="632" height="153.212" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<text x="24" y="554" font-size="27" font-weight="700" fill="#275eb0" text-anchor="start">Separate HTML table example</text>
<text x="24" y="608" font-size="24" font-weight="700" fill="#14253d" text-anchor="start">Slide-level import</text>
<text x="354" y="608" font-size="24" font-weight="700" fill="#14253d" text-anchor="start">Paragraph-level import</text>
<image x="24" y="626" width="302" height="135.900" href="data:image/png;base64,"/>
<rect x="24" y="626" width="302" height="135.9" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<image x="354" y="626" width="302" height="135.900" href="data:image/png;base64,"/>
<rect x="354" y="626" width="302" height="135.9" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<text x="24" y="801" font-size="23" font-weight="400" fill="#40536b" text-anchor="start">Table object</text>
<text x="354" y="801" font-size="23" font-weight="400" fill="#40536b" text-anchor="start">Text in an existing shape</text>
</g>
</svg>
