<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 350">
<title id="title">Change the paint order of overlapping shapes</title>
<desc id="description">Before reorder the blue rectangle is in front. After reorder the red rectangle is in front.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Before reorder</text>
<image x="26.000" y="49.000" width="334.000" height="229.000" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="26.000" y="49.000" width="334.000" height="229.000" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="26" y="308" font-size="17" font-weight="400" text-anchor="start" fill="#40536b">Index 0 · Back · Red rectangle</text>
<text x="26" y="334" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Index 1 · Front · Blue rectangle</text>
<text x="398" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">After moving first shape to front</text>
<image x="398.000" y="49.000" width="334.000" height="229.000" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="398.000" y="49.000" width="334.000" height="229.000" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="398" y="308" font-size="17" font-weight="400" text-anchor="start" fill="#40536b">Index 0 · Back · Blue rectangle</text>
<text x="398" y="334" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Index 1 · Front · Red rectangle</text>
</g>
</svg>
