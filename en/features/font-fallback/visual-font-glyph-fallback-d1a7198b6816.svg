<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 453">
<title id="title">Fallback for α</title>
<desc id="description">The first crop uses automatic fallback. The second uses the explicit range rule.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<defs><marker id="14253d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#14253d"/></marker><marker id="275eb0-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#275eb0"/></marker><marker id="04776f-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#04776f"/></marker><marker id="b6501e-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b6501e"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<text x="30" y="97" text-anchor="start" font-size="32" fill="#14253d" font-weight="700">Microsoft Himalaya lacks α</text>
<text x="30" y="133" text-anchor="start" font-size="26" fill="#40536b">Rule range: U+0370–U+03FF</text>
<rect x="30" y="158" width="700" height="125" rx="8" fill="#f0f5fc" stroke="#cedaea" stroke-width="2"/>
<text x="47" y="190" text-anchor="start" font-size="27" fill="#14253d" font-weight="700">No explicit rule</text>
<text x="47" y="225" text-anchor="start" font-size="27" fill="#04776f">Courier New</text>
<image x="318" y="176" width="398.72" height="78.4" href="data:image/png;base64,"/>
<line x1="494" y1="246" x2="549" y2="246" stroke="#04776f" stroke-width="3"/>
<rect x="30" y="297" width="700" height="125" rx="8" fill="#f0f5fc" stroke="#cedaea" stroke-width="2"/>
<text x="47" y="329" text-anchor="start" font-size="27" fill="#14253d" font-weight="700">Explicit rule</text>
<text x="47" y="364" text-anchor="start" font-size="27" fill="#04776f">Arial</text>
<image x="318" y="315" width="398.72" height="78.4" href="data:image/png;base64,"/>
<line x1="494" y1="385" x2="549" y2="385" stroke="#04776f" stroke-width="3"/>
</g>
</svg>
