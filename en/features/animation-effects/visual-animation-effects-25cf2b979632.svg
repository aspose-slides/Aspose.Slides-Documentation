<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 978.8000000000001">
<title id="title">A fade in actual player frames</title>
<desc id="description">Actual cropped frames with unchanged pixels and explicit frame indices.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">A fade in actual player frames</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL PLAYER FRAMES • 10 FRAMES PER SECOND</text>
<text x="40" y="105.0" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Frame 10 — 1.0 s — before fade</text>
<svg x="40" y="120.0" width="680" height="217.6" viewBox="90 70 500 160"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="120.0" width="680" height="217.6" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="374.6" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Frame 13 — 1.3 s — during fade</text>
<svg x="40" y="389.6" width="680" height="217.6" viewBox="90 70 500 160"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="389.6" width="680" height="217.6" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="644.2" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Frame 15 — 1.5 s — rectangle visible</text>
<svg x="40" y="659.2" width="680" height="217.6" viewBox="90 70 500 160"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="659.2" width="680" height="217.6" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="949.8000000000001" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Cropped at the same coordinates; timing labels use frame index ÷ FPS.</text>
</g>
</svg>
