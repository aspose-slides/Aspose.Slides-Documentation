<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 340">
<title id="title">Triangle path in a rectangle&#x27;s local coordinates</title>
<desc id="description">The triangle render has three numbered path vertices inside a dashed slide-frame rectangle. Arrows trace the path and closure.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="27" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Slide frame</text>
<text x="27" y="63" font-size="17" font-weight="400" text-anchor="start" fill="#40536b">Top-left on slide</text>
<text x="27" y="89" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">(60, 60) pt</text>
<text x="27" y="123" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">240 × 160 pt</text>
<image x="218.000" y="16.000" width="456.000" height="312.000" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="290.000" y="88.000" width="288.000" height="192.000" fill="none" stroke="#275eb0" stroke-width="2" stroke-dasharray="6 4" rx="0" opacity="1"/>
<path d="M164.00 94.00L284.00 88.00" fill="none" stroke="#275eb0" stroke-width="2" stroke-dasharray=""/>
<polygon points="284.00,88.00 276.47,92.93 276.02,83.84" fill="#275eb0"/>
<circle cx="290" cy="88" r="4" fill="#275eb0" stroke="#fff" stroke-width="2"/>
<text x="280" y="79" font-size="16" font-weight="700" text-anchor="end" fill="#275eb0">(0, 0) local</text>
<circle cx="434" cy="88" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<text x="434" y="73" font-size="16" font-weight="700" text-anchor="middle" fill="#14253d">1  (120, 0)</text>
<circle cx="578" cy="280" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<text x="588" y="299" font-size="16" font-weight="700" text-anchor="start" fill="#14253d">2  (240, 160)</text>
<circle cx="290" cy="280" r="5" fill="#14253d" stroke="#fff" stroke-width="2"/>
<text x="283" y="299" font-size="16" font-weight="700" text-anchor="end" fill="#14253d">3  (0, 160)</text>
<path d="M474.00 143.00L500.00 177.00" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray=""/>
<polygon points="500.00,177.00 491.67,173.60 498.90,168.07" fill="#14253d"/>
<path d="M458.00 267.00L407.00 267.00" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray=""/>
<polygon points="407.00,267.00 414.77,262.45 414.77,271.55" fill="#14253d"/>
<path d="M365.00 181.00L391.00 145.00" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray=""/>
<polygon points="391.00,145.00 390.14,153.96 382.77,148.63" fill="#14253d"/>
<text x="433" y="322" font-size="16" font-weight="400" text-anchor="middle" fill="#40536b">Close the path back to vertex 1</text>
</g>
</svg>
