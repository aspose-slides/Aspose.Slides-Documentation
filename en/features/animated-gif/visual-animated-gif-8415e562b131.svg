<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 690">
<title id="title">GIF output and its two slide states</title>
<desc id="description">The real exported GIF is accompanied by static source-slide renders.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">GIF output and its two slide states</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL GIF AND STATIC SLIDE OUTPUT</text>
<text x="26" y="103" font-size="19" font-weight="bold" text-anchor="start" fill="#275eb0">Exported GIF: 320 × 180 px</text>
<svg x="220" y="120" width="320" height="180" viewBox="0 0 320 180"><image width="320" height="180" href="data:image/gif;base64,"/></svg>
<rect x="220" y="120" width="320" height="180" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="26" y="340" font-size="19" font-weight="bold" text-anchor="start" fill="#04776f">Static reference states</text>
<svg x="26" y="360" width="332" height="187" viewBox="0 0 640 360"><image width="640" height="360" href="data:image/png;base64,"/></svg>
<rect x="26" y="360" width="332" height="187" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<svg x="402" y="360" width="332" height="187" viewBox="0 0 640 360"><image width="640" height="360" href="data:image/png;base64,"/></svg>
<rect x="402" y="360" width="332" height="187" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="26" y="575" font-size="18" font-weight="normal" text-anchor="start" fill="#275eb0">Slide 1: red</text>
<text x="402" y="575" font-size="18" font-weight="normal" text-anchor="start" fill="#275eb0">Slide 2: blue</text>
<text x="26" y="617" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Configured: DefaultDelay = 1,200 ms; TransitionFps = 10.</text>
<text x="26" y="640" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Observed GIF: four frames, delays 1,000 / 1,200 / 1,000 / 1,200 ms.</text>
</g>
</svg>
