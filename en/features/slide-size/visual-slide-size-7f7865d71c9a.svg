<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 680 940">
<title id="title">Resize without moving the rectangle</title>
<desc id="description">DoNotScale keeps a 240 by 100-point rectangle at x 60, y 60 on a 960 by 540-point slide. In a separate example, Maximize scales another 240 by 100-point rectangle to 320 by about 133 points.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="24" y="44" font-size="34" font-weight="700" fill="#14253d" text-anchor="start">Resize without moving the rectangle</text>
<text x="24" y="87" font-size="27" font-weight="700" fill="#275eb0" text-anchor="start">DoNotScale · 960 × 540 pt</text>
<image x="24" y="107" width="632" height="355.500" href="data:image/png;base64,"/>
<rect x="24" y="107" width="632" height="355.5" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<text x="24" y="504" font-size="26" font-weight="700" fill="#14253d" text-anchor="start">Origin   (60, 60) pt</text>
<text x="366" y="504" font-size="26" font-weight="700" fill="#14253d" text-anchor="start">Frame   240 × 100 pt</text>
<path d="M290 481L64 151" stroke="#04776f" stroke-width="3" fill="none"/>
<path d="M64 151L74.7 156.44" stroke="#04776f" stroke-width="3" fill="none"/>
<path d="M64 151L65.2 162.94" stroke="#04776f" stroke-width="3" fill="none"/>
<text x="24" y="575" font-size="27" font-weight="700" fill="#275eb0" text-anchor="start">Separate example · Maximize</text>
<text x="24" y="620" font-size="24" font-weight="700" fill="#14253d" text-anchor="start">Before · 720 × 540 pt</text>
<text x="315" y="620" font-size="24" font-weight="700" fill="#14253d" text-anchor="start">After · 960 × 540 pt</text>
<image x="24" y="638" width="255.6" height="191.700" href="data:image/png;base64,"/>
<rect x="24" y="638" width="255.6" height="191.7" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<text x="24" y="860" font-size="24" font-weight="700" fill="#14253d" text-anchor="start">Frame  240 × 100 pt</text>
<image x="315" y="638" width="340.79999999999995" height="191.700" href="data:image/png;base64,"/>
<rect x="315" y="638" width="340.79999999999995" height="191.7" rx="2" fill="none" stroke="#cedaea" stroke-width="2"/>
<text x="315" y="860" font-size="24" font-weight="700" fill="#14253d" text-anchor="start">Frame  320 × 133.3 pt</text>
<text x="24" y="908" font-size="22" font-weight="400" fill="#40536b" text-anchor="start">Both Maximize panels use the same scale.</text>
</g>
</svg>
