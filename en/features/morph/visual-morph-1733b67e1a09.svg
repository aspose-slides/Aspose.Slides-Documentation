<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 620">
<title id="title">Matching shapes on two slides</title>
<desc id="description">Actual source and destination slide crops show the same named rectangle at changed position and width.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Matching shapes on two slides</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL SLIDE ENDPOINTS • TRANSITION IS CONFIGURED</text>
<text x="40" y="105" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Slide 1: x = 120, width = 320 pt</text>
<svg x="40" y="120" width="680" height="175" viewBox="0 60 700 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="120" width="680" height="175" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="350" font-size="18" font-weight="bold" text-anchor="start" fill="#04776f">Slide 2: x = 260, width = 400 pt</text>
<svg x="40" y="365" width="680" height="175" viewBox="0 60 700 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="365" width="680" height="175" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="590" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">Both shapes are named !!Results. Morph is set on the second slide.</text>
</g>
</svg>
