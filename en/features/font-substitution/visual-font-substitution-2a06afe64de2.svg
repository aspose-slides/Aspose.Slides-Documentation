<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 332">
<title id="title">Font family substitution during rendering</title>
<desc id="description">The saved deck retains CatalogueMissingFont while the exported text is drawn with Arial.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<defs><marker id="14253d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#14253d"/></marker><marker id="275eb0-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#275eb0"/></marker><marker id="04776f-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#04776f"/></marker><marker id="b6501e-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b6501e"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<text x="30" y="102" text-anchor="start" font-size="30" fill="#275eb0" font-weight="700">Saved PPTX assignment</text>
<text x="30" y="139" text-anchor="start" font-size="28" fill="#14253d">CatalogueMissingFont</text>
<line x1="362" y1="124" x2="412" y2="124" stroke="#275eb0" stroke-width="3" marker-end="url(#275eb0-arrow)"/>
<text x="441" y="102" text-anchor="start" font-size="30" fill="#04776f" font-weight="700">Render output</text>
<text x="441" y="139" text-anchor="start" font-size="28" fill="#14253d">Arial</text>
<image x="31" y="176" width="694.6" height="119.6" href="data:image/png;base64,"/>
</g>
</svg>
