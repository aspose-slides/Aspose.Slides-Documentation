<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 938.0">
<title id="title">Numbered frames expose animation progress</title>
<desc id="description">Actual cropped frames with unchanged pixels and explicit frame indices.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Numbered frames expose animation progress</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL PLAYER FRAMES • 10 FRAMES PER SECOND</text>
<text x="40" y="105.0" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Frame 10 — 1.0 s</text>
<svg x="40" y="120.0" width="680" height="204.0" viewBox="20 20 600 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="120.0" width="680" height="204.0" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="361.0" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Frame 15 — 1.5 s</text>
<svg x="40" y="376.0" width="680" height="204.0" viewBox="20 20 600 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="376.0" width="680" height="204.0" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="617.0" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Frame 19 — 1.9 s — final exported frame</text>
<svg x="40" y="632.0" width="680" height="204.0" viewBox="20 20 600 180"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="632.0" width="680" height="204.0" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="909.0" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Cropped at the same coordinates; timing labels use frame index ÷ FPS.</text>
</g>
</svg>
