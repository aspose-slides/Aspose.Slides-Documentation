<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 535">
<title id="title">Reveal button and animation target</title>
<desc id="description">A real static slide crop identifies the two shapes used by the configured interactive sequence.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Reveal button and animation target</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL STATIC SLIDE • SCHEMATIC TRIGGER CONNECTION</text>
<svg x="40" y="100" width="680" height="288" viewBox="0 0 500 212"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="100" width="680" height="288" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="423" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Trigger: Reveal button</text>
<path d="M300,417 L420,417" fill="none" stroke="#04776f" stroke-width="2"/>
<polygon points="420.0,417.0 411.9,420.9 411.9,413.1" fill="#04776f"/>
<text x="450" y="423" font-size="18" font-weight="bold" text-anchor="start" fill="#04776f">Target: fade effect</text>
<text x="40" y="477" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">The PNG identifies shapes; it does not execute the click.</text>
</g>
</svg>
