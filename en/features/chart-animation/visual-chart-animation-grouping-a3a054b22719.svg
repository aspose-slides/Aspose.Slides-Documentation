<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 620">
<title id="title">Two chart series on successive clicks</title>
<desc id="description">A static chart render is paired with the two configured series-trigger steps.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Two chart series on successive clicks</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL STATIC CHART • SCHEMATIC CLICK SEQUENCE</text>
<svg x="40" y="95" width="680" height="384" viewBox="40 40 620 350"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="95" width="680" height="384" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<rect x="26" y="520" width="330" height="70" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="42" y="549" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Click 1: Sales</text>
<text x="42" y="578" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Series index 0</text>
<rect x="404" y="520" width="330" height="70" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="420" y="549" font-size="18" font-weight="bold" text-anchor="start" fill="#04776f">Click 2: Target</text>
<text x="420" y="578" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Series index 1</text>
<path d="M360,555 L400,555" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="400.0,555.0 391.9,558.9 391.9,551.1" fill="#275eb0"/>
</g>
</svg>
