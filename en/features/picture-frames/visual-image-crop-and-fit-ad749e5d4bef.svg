<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 248">
<title id="title">Frame aspect ratio and image stretch</title>
<desc id="description">A 2 to 1 source is shown in two picture frames. The matching frame preserves its proportions. The narrower frame stretches it vertically.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="51" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Matching aspect ratio</text>
<text x="434" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Different aspect ratio</text>
<image x="30.000" y="54.000" width="651.000" height="157.500" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="51.000" y="54.000" width="315.000" height="157.500" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<rect x="434.250" y="54.000" width="210.000" height="157.500" fill="none" stroke="#14253d" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="208.5" y="233" font-size="17" font-weight="400" text-anchor="middle" fill="#40536b">300 × 150 pt frame</text>
<text x="539.25" y="233" font-size="17" font-weight="400" text-anchor="middle" fill="#40536b">200 × 150 pt frame</text>
</g>
</svg>
