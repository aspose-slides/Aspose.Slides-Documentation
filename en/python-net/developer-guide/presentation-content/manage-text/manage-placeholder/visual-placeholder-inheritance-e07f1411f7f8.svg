<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 745">
<title id="title">Removing the role does not delete the shape</title>
<desc id="description">An actual inherited title loses its base link and inherited dimensions, while its text and collection membership remain.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Removing the role does not delete the shape</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">ACTUAL OUTPUT • CONTROLLED INHERITED-TITLE FIXTURE</text>
<text x="40" y="105" font-size="19" font-weight="bold" text-anchor="start" fill="#275eb0">Before: title placeholder</text>
<svg x="40" y="120" width="680" height="136" viewBox="0 0 720 144"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="120" width="680" height="136" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<text x="40" y="295" font-size="19" font-weight="bold" text-anchor="start" fill="#04776f">After: ordinary shape, same text retained</text>
<svg x="40" y="310" width="680" height="136" viewBox="0 0 720 144"><image width="720" height="540" href="data:image/png;base64,"/></svg>
<rect x="40" y="310" width="680" height="136" rx="0" fill="none" stroke="#cedaea" stroke-width="1.5"/>
<rect x="26" y="501" width="330" height="105" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="42" y="530" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Before: base link present</text>
<text x="42" y="559" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Frame: (36, 21.625),</text>
<text x="42" y="582" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">648 × 90 pt</text>
<rect x="404" y="501" width="330" height="105" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="420" y="530" font-size="18" font-weight="bold" text-anchor="start" fill="#b6501e">After: base link absent</text>
<text x="420" y="559" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Frame: (0, 0), 0 × 0 pt</text>
<text x="420" y="582" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Shape count and text retained</text>
<text x="26" y="652" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">To preserve appearance: capture resolved values before removal,</text>
<text x="26" y="676" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">then explicitly reapply geometry and the required formatting.</text>
<text x="26" y="700" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">Other templates can produce different changes.</text>
</g>
</svg>
