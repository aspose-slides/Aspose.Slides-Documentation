<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 323">
<title id="title">One image resource, several uses</title>
<desc id="description">Two picture frames and a slide background use the same embedded image. Replacement affects all three. SVG conversion is a separate route to editable slide shapes.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="24" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Shared image resource</text>
<rect x="28.000" y="58.000" width="265.000" height="141.000" fill="#f0f5fc" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="10" opacity="1"/>
<text x="45" y="90" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Presentation image collection</text>
<image x="45.000" y="104.000" width="103.000" height="77.250" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="45.000" y="104.000" width="103.000" height="77.250" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="164" y="133" font-size="17" font-weight="400" text-anchor="start" fill="#14253d">One embedded</text>
<text x="164" y="157" font-size="17" font-weight="400" text-anchor="start" fill="#14253d">image resource</text>
<rect x="483.000" y="53.000" width="247.000" height="36.000" fill="#ecf8f5" stroke="#beddd7" stroke-width="2" stroke-dasharray="" rx="7" opacity="1"/>
<text x="499" y="76" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Picture frame A</text>
<path d="M303.00 128.00L471.00 71.00" fill="none" stroke="#04776f" stroke-width="2" stroke-dasharray=""/>
<polygon points="471.00,71.00 465.11,77.80 462.18,69.19" fill="#04776f"/>
<rect x="483.000" y="101.000" width="247.000" height="36.000" fill="#ecf8f5" stroke="#beddd7" stroke-width="2" stroke-dasharray="" rx="7" opacity="1"/>
<text x="499" y="124" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Picture frame B</text>
<path d="M303.00 128.00L471.00 119.00" fill="none" stroke="#04776f" stroke-width="2" stroke-dasharray=""/>
<polygon points="471.00,119.00 463.49,123.96 463.00,114.87" fill="#04776f"/>
<rect x="483.000" y="149.000" width="247.000" height="36.000" fill="#ecf8f5" stroke="#beddd7" stroke-width="2" stroke-dasharray="" rx="7" opacity="1"/>
<text x="499" y="172" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Slide background fill</text>
<path d="M303.00 128.00L471.00 167.00" fill="none" stroke="#04776f" stroke-width="2" stroke-dasharray=""/>
<polygon points="471.00,167.00 462.41,169.68 464.46,160.81" fill="#04776f"/>
<text x="29" y="229" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Replace this resource to update all three uses.</text>
<path d="M28.00 245.00L732.00 245.00" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray=""/>
<rect x="28.000" y="264.000" width="183.000" height="38.000" fill="#f0f5fc" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="7" opacity="1"/>
<text x="45" y="289" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">SVG artwork</text>
<path d="M221.00 283.00L498.00 283.00" fill="none" stroke="#275eb0" stroke-width="2" stroke-dasharray=""/>
<polygon points="498.00,283.00 490.23,287.55 490.23,278.45" fill="#275eb0"/>
<rect x="504.000" y="264.000" width="227.000" height="38.000" fill="#ecf8f5" stroke="#beddd7" stroke-width="2" stroke-dasharray="" rx="7" opacity="1"/>
<text x="518" y="289" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Editable slide shapes</text>
<rect x="304.000" y="266.000" width="114.000" height="30.000" fill="#fff" stroke="none" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="361" y="288" font-size="17" font-weight="700" text-anchor="middle" fill="#275eb0">Convert</text>
</g>
</svg>
