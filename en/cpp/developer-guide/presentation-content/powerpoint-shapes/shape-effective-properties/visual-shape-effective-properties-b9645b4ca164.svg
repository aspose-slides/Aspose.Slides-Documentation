<text x="26" y="505" font-size="18" font-weight="normal" text-anchor="start" fill="#40536b">The portion’s local value overrides its paragraph default.</text>
<text x="26" y="530" font-size="18" font-weight="normal" text-anchor="start" fill="#40536b">Clearing a level restores inheritance from the next applicable level.</text>
<text x="26" y="555" font-size="18" font-weight="normal" text-anchor="start" fill="#40536b">Read effective values again after each formatting change.</text>
