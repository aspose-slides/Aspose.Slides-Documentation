<text x="161" y="251" font-size="22" font-weight="bold" text-anchor="middle" fill="#04776f">2</text>
<rect x="256" y="220" width="100" height="48" rx="6" fill="#e3f4ef" stroke="#04776f" stroke-width="1.5"/>
<text x="306" y="251" font-size="22" font-weight="bold" text-anchor="middle" fill="#04776f">2</text>
<text x="405" y="105" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">By category</text>
<text x="517" y="140" font-size="16" font-weight="normal" text-anchor="middle" fill="#40536b">North</text>
<text x="662" y="140" font-size="16" font-weight="normal" text-anchor="middle" fill="#40536b">South</text>
<text x="405" y="183" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Sales</text>
<rect x="490" y="155" width="100" height="48" rx="6" fill="#e9f0fc" stroke="#275eb0" stroke-width="1.5"/>
<text x="540" y="186" font-size="22" font-weight="bold" text-anchor="middle" fill="#275eb0">1</text>
<rect x="635" y="155" width="100" height="48" rx="6" fill="#e9f0fc" stroke="#275eb0" stroke-width="1.5"/>
<text x="685" y="186" font-size="22" font-weight="bold" text-anchor="middle" fill="#275eb0">2</text>
<text x="405" y="248" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Target</text>
<rect x="490" y="220" width="100" height="48" rx="6" fill="#e3f4ef" stroke="#04776f" stroke-width="1.5"/>
<text x="540" y="251" font-size="22" font-weight="bold" text-anchor="middle" fill="#04776f">1</text>
