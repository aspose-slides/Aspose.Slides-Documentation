<rect x="256" y="480" width="100" height="48" rx="6" fill="#e3f4ef" stroke="#04776f" stroke-width="1.5"/>
<text x="306" y="511" font-size="22" font-weight="bold" text-anchor="middle" fill="#04776f">4</text>
<text x="405" y="365" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Element within category</text>
<text x="517" y="400" font-size="16" font-weight="normal" text-anchor="middle" fill="#40536b">North</text>
<text x="662" y="400" font-size="16" font-weight="normal" text-anchor="middle" fill="#40536b">South</text>
<text x="405" y="443" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Sales</text>
<rect x="490" y="415" width="100" height="48" rx="6" fill="#e9f0fc" stroke="#275eb0" stroke-width="1.5"/>
<text x="540" y="446" font-size="22" font-weight="bold" text-anchor="middle" fill="#275eb0">1</text>
<rect x="635" y="415" width="100" height="48" rx="6" fill="#e9f0fc" stroke="#275eb0" stroke-width="1.5"/>
<text x="685" y="446" font-size="22" font-weight="bold" text-anchor="middle" fill="#275eb0">3</text>
<text x="405" y="508" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Target</text>
<rect x="490" y="480" width="100" height="48" rx="6" fill="#e3f4ef" stroke="#04776f" stroke-width="1.5"/>
<text x="540" y="511" font-size="22" font-weight="bold" text-anchor="middle" fill="#04776f">2</text>
<rect x="635" y="480" width="100" height="48" rx="6" fill="#e3f4ef" stroke="#04776f" stroke-width="1.5"/>
<text x="685" y="511" font-size="22" font-weight="bold" text-anchor="middle" fill="#04776f">4</text>
<text x="26" y="612" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Numbers = illustrative step order; both color and row labels identify series.</text>
