<text x="138" y="400" font-size="16" font-weight="normal" text-anchor="middle" fill="#40536b">North</text>
<text x="283" y="400" font-size="16" font-weight="normal" text-anchor="middle" fill="#40536b">South</text>
<text x="26" y="443" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Sales</text>
<rect x="111" y="415" width="100" height="48" rx="6" fill="#e9f0fc" stroke="#275eb0" stroke-width="1.5"/>
<text x="161" y="446" font-size="22" font-weight="bold" text-anchor="middle" fill="#275eb0">1</text>
<rect x="256" y="415" width="100" height="48" rx="6" fill="#e9f0fc" stroke="#275eb0" stroke-width="1.5"/>
