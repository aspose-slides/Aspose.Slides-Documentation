<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 495">
<title id="title">Absolute endpoint or relative offset</title>
<desc id="description">Both commands travel from .2,0 to .3,.1; the relative delta is .1,.1.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Absolute endpoint or relative offset</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">CONCEPTUAL DIAGRAM</text>
<text x="26" y="140" font-size="19" font-weight="bold" text-anchor="start" fill="#275eb0">Absolute</text>
<path d="M280,132 L630,208" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="630.0,208.0 621.2,210.1 622.9,202.5" fill="#275eb0"/>
<circle cx="280" cy="132" r="7" fill="#275eb0"/>
<text x="220" y="108" font-size="17" font-weight="normal" text-anchor="start" fill="#14253d">Start (0.2, 0)</text>
<circle cx="630" cy="208" r="7" fill="#275eb0"/>
<text x="480" y="240" font-size="17" font-weight="normal" text-anchor="start" fill="#14253d">End (0.3, 0.1)</text>
<text x="370" y="134" font-size="17" font-weight="normal" text-anchor="start" fill="#275eb0">Endpoint = (0.3, 0.1)</text>
<text x="26" y="285" font-size="19" font-weight="bold" text-anchor="start" fill="#04776f">Relative</text>
<path d="M280,277 L630,353" fill="none" stroke="#04776f" stroke-width="2"/>
<polygon points="630.0,353.0 621.2,355.1 622.9,347.5" fill="#04776f"/>
<circle cx="280" cy="277" r="7" fill="#04776f"/>
<text x="220" y="253" font-size="17" font-weight="normal" text-anchor="start" fill="#14253d">Start (0.2, 0)</text>
<circle cx="630" cy="353" r="7" fill="#04776f"/>
<text x="480" y="385" font-size="17" font-weight="normal" text-anchor="start" fill="#14253d">End (0.3, 0.1)</text>
<text x="370" y="279" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Delta = (+0.1, +0.1)</text>
<text x="26" y="447" font-size="20" font-weight="bold" text-anchor="start" fill="#14253d">(0.2, 0) + (0.1, 0.1) = (0.3, 0.1)</text>
</g>
</svg>
