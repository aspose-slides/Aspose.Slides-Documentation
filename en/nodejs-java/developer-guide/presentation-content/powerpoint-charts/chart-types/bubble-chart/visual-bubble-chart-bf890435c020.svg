<text x="41.00" y="207.20" font-size="18" fill="#14253d" text-anchor="end" font-weight="400">4</text>
<line x1="225.80" y1="86.00" x2="225.80" y2="278.00" stroke="#cedaea" stroke-width="1.5"/>
<line x1="53.00" y1="162.80" x2="341.00" y2="162.80" stroke="#cedaea" stroke-width="1.5"/>
