<text x="421.00" y="245.60" font-size="18" fill="#14253d" text-anchor="end" font-weight="400">2</text>
<line x1="548.20" y1="86.00" x2="548.20" y2="278.00" stroke="#cedaea" stroke-width="1.5"/>
<line x1="433.00" y1="201.20" x2="721.00" y2="201.20" stroke="#cedaea" stroke-width="1.5"/>
