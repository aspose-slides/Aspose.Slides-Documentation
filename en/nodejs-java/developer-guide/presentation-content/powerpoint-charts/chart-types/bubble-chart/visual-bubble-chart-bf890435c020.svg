<line x1="433.00" y1="124.40" x2="721.00" y2="124.40" stroke="#cedaea" stroke-width="1.5"/>
<text x="663.40" y="302.00" font-size="18" fill="#14253d" text-anchor="middle" font-weight="400">8</text>
<text x="421.00" y="130.40" font-size="18" fill="#14253d" text-anchor="end" font-weight="400">8</text>
<line x1="721.00" y1="86.00" x2="721.00" y2="278.00" stroke="#cedaea" stroke-width="1.5"/>
<line x1="433.00" y1="86.00" x2="721.00" y2="86.00" stroke="#cedaea" stroke-width="1.5"/>
<text x="721.00" y="302.00" font-size="18" fill="#14253d" text-anchor="middle" font-weight="400">10</text>
<text x="421.00" y="92.00" font-size="18" fill="#14253d" text-anchor="end" font-weight="400">10</text>
<rect x="433.00" y="86.00" width="288.00" height="192.00" fill="none" stroke="#40536b" stroke-width="1"/>
<text x="742.00" y="303.00" font-size="20" fill="#14253d" text-anchor="start" font-weight="700">X</text>
<text x="394.00" y="80.00" font-size="20" fill="#14253d" text-anchor="start" font-weight="700">Y</text>
<circle cx="490.60" cy="220.40" r="3.6667" fill="#dce9ff" stroke="#275eb0" stroke-width="1.5"/>
<text x="490.60" y="209.73" font-size="20" fill="#275eb0" text-anchor="middle" font-weight="700">1</text>
<circle cx="577.00" cy="182.00" r="14.6667" fill="#dce9ff" stroke="#275eb0" stroke-width="1.5"/>
<text x="577.00" y="160.33" font-size="20" fill="#275eb0" text-anchor="middle" font-weight="700">4</text>
<circle cx="663.40" cy="143.60" r="33.0000" fill="#dce9ff" stroke="#275eb0" stroke-width="1.5"/>
<text x="663.40" y="103.60" font-size="20" fill="#275eb0" text-anchor="middle" font-weight="700">9</text>
