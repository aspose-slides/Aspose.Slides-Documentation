<line x1="53.00" y1="86.00" x2="53.00" y2="278.00" stroke="#cedaea" stroke-width="1.5"/>
<line x1="53.00" y1="278.00" x2="341.00" y2="278.00" stroke="#cedaea" stroke-width="1.5"/>
<text x="53.00" y="302.00" font-size="18" fill="#14253d" text-anchor="middle" font-weight="400">0</text>
<text x="41.00" y="284.00" font-size="18" fill="#14253d" text-anchor="end" font-weight="400">0</text>
<line x1="110.60" y1="86.00" x2="110.60" y2="278.00" stroke="#cedaea" stroke-width="1.5"/>
