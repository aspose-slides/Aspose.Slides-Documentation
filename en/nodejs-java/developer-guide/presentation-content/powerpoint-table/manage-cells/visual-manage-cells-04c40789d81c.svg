<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 525">
<title id="title">Split an unmerged cell by width</title>
<desc id="description">Splitting cell column 1, row 1 adds a column to the grid without splitting cells in the other rows.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<defs><marker id="14253d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#14253d"/></marker><marker id="275eb0-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#275eb0"/></marker><marker id="04776f-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#04776f"/></marker><marker id="b6501e-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b6501e"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<text x="45" y="104" text-anchor="start" font-size="33" fill="#14253d" font-weight="700">Before</text>
<text x="417" y="104" text-anchor="start" font-size="33" fill="#14253d" font-weight="700">After width split</text>
<text x="45" y="139" text-anchor="start" font-size="26" fill="#40536b">Four 70 pt columns</text>
<text x="417" y="139" text-anchor="start" font-size="26" fill="#40536b">Five grid columns</text>
<image x="45.96" y="183.96" width="289.68" height="289.68" href="data:image/png;base64,"/>
<text x="29" y="229.7" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="29" y="301.1" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="29" y="372.5" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<text x="29" y="443.9" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">3</text>
<text x="83.7" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="155.1" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="226.5" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<text x="297.9" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">3</text>
<image x="417.96" y="183.96" width="289.68" height="289.68" href="data:image/png;base64,"/>
<text x="401" y="229.7" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="401" y="301.1" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="401" y="372.5" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<text x="401" y="443.9" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">3</text>
<text x="455.7" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="509.25" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="544.95" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<text x="598.5" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">3</text>
<text x="669.9" y="177" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">4</text>
<rect x="119.4" y="257.4" width="71.4" height="71.4" rx="0" fill="none" stroke="#04776f" stroke-width="3"/>
<rect x="491.4" y="257.4" width="71.4" height="71.4" rx="0" fill="none" stroke="#04776f" stroke-width="3"/>
<line x1="527.1" y1="257.4" x2="527.1" y2="328.8" stroke="#b6501e" stroke-width="4"/>
<text x="48" y="504" text-anchor="start" font-size="29" fill="#04776f" font-weight="700">70 pt → 35 + 35 pt</text>
<text x="420" y="504" text-anchor="start" font-size="25" fill="#04776f" font-weight="700">Right indices: 2→3, 3→4</text>
</g>
</svg>
