<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 439">
<title id="title">Contain and crop in the same template frames</title>
<desc id="description">The portrait and landscape preview renders compare padding when contained with clipped edges when cropped.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="189" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Contain</text>
<text x="485" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Crop</text>
<text x="25" y="131" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Portrait</text>
<image x="190.000" y="66.000" width="171.000" height="136.800" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="190.000" y="66.000" width="171.000" height="136.800" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="190" y="227" font-size="15" font-weight="400" text-anchor="start" fill="#40536b">Side padding</text>
<image x="485.000" y="66.000" width="171.000" height="136.800" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="485.000" y="66.000" width="171.000" height="136.800" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="485" y="227" font-size="15" font-weight="400" text-anchor="start" fill="#40536b">Top and bottom clipped</text>
<text x="25" y="326" font-size="17" font-weight="700" text-anchor="start" fill="#14253d">Landscape</text>
<image x="190.000" y="261.000" width="171.000" height="136.800" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="190.000" y="261.000" width="171.000" height="136.800" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="190" y="422" font-size="15" font-weight="400" text-anchor="start" fill="#40536b">Top and bottom padding</text>
<image x="485.000" y="261.000" width="171.000" height="136.800" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="485.000" y="261.000" width="171.000" height="136.800" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<text x="485" y="422" font-size="15" font-weight="400" text-anchor="start" fill="#40536b">Left and right clipped</text>
<path d="M24.00 243.00L736.00 243.00" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray=""/>
</g>
</svg>
