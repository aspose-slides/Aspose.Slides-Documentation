<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 680">
<title id="title">Two ways to align a worksheet range and OLE frame</title>
<desc id="description">Blue outlines identify the OLE frame; green grids identify the cell range. One remedy resizes the frame, while the other scales cells into an unchanged frame.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Two ways to align a worksheet range and OLE frame</text>
<text x="26" y="61" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">CONCEPTUAL DIAGRAM</text>
<text x="26" y="91" font-size="13" font-weight="bold" text-anchor="start" fill="#275eb0">BLUE OUTLINE = OLE FRAME</text>
<text x="390" y="91" font-size="13" font-weight="bold" text-anchor="start" fill="#04776f">GREEN GRID = CELL RANGE</text>
<text x="26" y="132" font-size="19" font-weight="bold" text-anchor="start" fill="#275eb0">A. Keep the range; resize the frame</text>
<rect x="26" y="159" width="300" height="132" rx="0" fill="none" stroke="#275eb0" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="48" y="180" width="220" height="88" rx="0" fill="#fff" stroke="#275eb0" stroke-width="1.5"/>
<path d="M92.0 180 V268" stroke="#cedaea"/>
<path d="M136.0 180 V268" stroke="#cedaea"/>
<path d="M180.0 180 V268" stroke="#cedaea"/>
<path d="M224.0 180 V268" stroke="#cedaea"/>
<path d="M48 202.0 H268" stroke="#cedaea"/>
<path d="M48 224.0 H268" stroke="#cedaea"/>
<path d="M48 246.0 H268" stroke="#cedaea"/>
<text x="57" y="194.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">1</text>
<text x="57" y="216.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">2</text>
<text x="57" y="238.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">3</text>
<text x="57" y="260.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">4</text>
<rect x="48" y="180" width="220" height="88" rx="0" fill="none" stroke="#04776f" stroke-width="1.5"/>
<rect x="433" y="180" width="220" height="88" rx="0" fill="none" stroke="#04776f" stroke-width="1.5"/>
<path d="M338,224 L407,224" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="407.0,224.0 398.9,227.9 398.9,220.1" fill="#275eb0"/>
<rect x="433" y="180" width="220" height="88" rx="0" fill="#fff" stroke="#275eb0" stroke-width="1.5"/>
<path d="M477.0 180 V268" stroke="#cedaea"/>
<path d="M521.0 180 V268" stroke="#cedaea"/>
<path d="M565.0 180 V268" stroke="#cedaea"/>
<path d="M609.0 180 V268" stroke="#cedaea"/>
<path d="M433 202.0 H653" stroke="#cedaea"/>
<path d="M433 224.0 H653" stroke="#cedaea"/>
<path d="M433 246.0 H653" stroke="#cedaea"/>
<text x="442" y="194.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">1</text>
<text x="442" y="216.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">2</text>
<text x="442" y="238.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">3</text>
<text x="442" y="260.3" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">4</text>
<rect x="429" y="176" width="228" height="96" rx="0" fill="none" stroke="#275eb0" stroke-width="1.5"/>
<rect x="433" y="180" width="220" height="88" rx="0" fill="none" stroke="#04776f" stroke-width="1.5"/>
<text x="26" y="319" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Original frame differs from range.</text>
<text x="414" y="319" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Frame fitted to the same range.</text>
<text x="26" y="353" font-size="17" font-weight="bold" text-anchor="start" fill="#275eb0">96-DPI preview pixels × 72 ÷ 96 = frame dimensions in points</text>
<text x="26" y="408" font-size="19" font-weight="bold" text-anchor="start" fill="#04776f">B. Keep the frame; scale the range</text>
<rect x="26" y="451" width="300" height="75" rx="0" fill="none" stroke="#275eb0" stroke-width="1.5"/>
<rect x="414" y="451" width="300" height="75" rx="0" fill="none" stroke="#275eb0" stroke-width="1.5"/>
<rect x="49" y="430" width="200" height="112" rx="0" fill="#fff" stroke="#275eb0" stroke-width="1.5"/>
<path d="M89.0 430 V542" stroke="#cedaea"/>
<path d="M129.0 430 V542" stroke="#cedaea"/>
<path d="M169.0 430 V542" stroke="#cedaea"/>
<path d="M209.0 430 V542" stroke="#cedaea"/>
<path d="M49 458.0 H249" stroke="#cedaea"/>
<path d="M49 486.0 H249" stroke="#cedaea"/>
<path d="M49 514.0 H249" stroke="#cedaea"/>
<text x="58" y="448.2" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">1</text>
<text x="58" y="476.2" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">2</text>
<text x="58" y="504.2" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">3</text>
<text x="58" y="532.2" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">4</text>
<rect x="49" y="430" width="200" height="112" rx="0" fill="none" stroke="#04776f" stroke-width="1.5"/>
<rect x="26" y="451" width="300" height="75" rx="0" fill="none" stroke="#275eb0" stroke-width="1.5"/>
<path d="M338,489 L403,489" fill="none" stroke="#275eb0" stroke-width="2"/>
<polygon points="403.0,489.0 394.9,492.9 394.9,485.1" fill="#275eb0"/>
<rect x="418" y="455" width="292" height="67" rx="0" fill="#fff" stroke="#275eb0" stroke-width="1.5"/>
<path d="M476.4 455 V522" stroke="#cedaea"/>
<path d="M534.8 455 V522" stroke="#cedaea"/>
<path d="M593.2 455 V522" stroke="#cedaea"/>
<path d="M651.6 455 V522" stroke="#cedaea"/>
<path d="M418 471.75 H710" stroke="#cedaea"/>
<path d="M418 488.5 H710" stroke="#cedaea"/>
<path d="M418 505.25 H710" stroke="#cedaea"/>
<text x="427" y="465.8875" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">1</text>
<text x="427" y="482.6375" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">2</text>
<text x="427" y="499.3875" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">3</text>
<text x="427" y="516.1375" font-size="14" font-weight="normal" text-anchor="start" fill="#40536b">4</text>
<rect x="418" y="455" width="292" height="67" rx="0" fill="none" stroke="#04776f" stroke-width="1.5"/>
<rect x="414" y="451" width="300" height="75" rx="0" fill="none" stroke="#275eb0" stroke-width="1.5"/>
<text x="26" y="576" font-size="16" font-weight="normal" text-anchor="start" fill="#275eb0">The blue frame stays 400 × 100 pt.</text>
<text x="414" y="576" font-size="16" font-weight="normal" text-anchor="start" fill="#04776f">The range now fits the frame.</text>
<text x="26" y="626" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Scale selected column widths and row heights independently.</text>
<text x="26" y="649" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">The diagrams distinguish the outlines; their strokes are offset for visibility.</text>
</g>
</svg>
