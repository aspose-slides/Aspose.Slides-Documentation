<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 682">
<title id="title">Split a vertically merged cell</title>
<desc id="description">The origin at column 1, row 2 spans two rows. Splitting separates Product A and Product B at the existing boundary.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<defs><marker id="14253d-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#14253d"/></marker><marker id="275eb0-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#275eb0"/></marker><marker id="04776f-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#04776f"/></marker><marker id="b6501e-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7 z" fill="#b6501e"/></marker></defs>
<text x="30" y="38" text-anchor="start" font-size="24" fill="#04776f" font-weight="700">SLIDE RENDER</text>
<line x1="30" y1="53" x2="730" y2="53" stroke="#cedaea" stroke-width="2"/>
<text x="30" y="85" text-anchor="start" font-size="30" fill="#14253d" font-weight="700">Before · one cell spans rows 2 and 3</text>
<image x="50.9" y="131.9" width="392.7" height="205.8" href="data:image/png;base64,"/>
<text x="34" y="167.2" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="34" y="217.6" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="34" y="268" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<text x="34" y="318.4" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">3</text>
<text x="97.625" y="125" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="247.25" y="125" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="396.875" y="125" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<rect x="142.25" y="234.8" width="210" height="100.8" rx="0" fill="none" stroke="#04776f" stroke-width="3"/>
<line x1="142.25" y1="285.2" x2="352.25" y2="285.2" stroke="#b6501e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="461" y="251" text-anchor="start" font-size="28" fill="#04776f" font-weight="700">Owner (1, 2)</text>
<text x="461" y="288" text-anchor="start" font-size="27" fill="#14253d">Split at existing</text>
<text x="461" y="318" text-anchor="start" font-size="27" fill="#14253d">row boundary</text>
<text x="30" y="386" text-anchor="start" font-size="30" fill="#14253d" font-weight="700">After · the grid indices stay fixed</text>
<image x="50.9" y="432.9" width="392.7" height="205.8" href="data:image/png;base64,"/>
<text x="34" y="468.2" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="34" y="518.6" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="34" y="569" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<text x="34" y="619.4" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">3</text>
<text x="97.625" y="426" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">0</text>
<text x="247.25" y="426" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">1</text>
<text x="396.875" y="426" text-anchor="middle" font-size="25" fill="#40536b" font-weight="700">2</text>
<rect x="142.25" y="535.8" width="210" height="100.8" rx="0" fill="none" stroke="#04776f" stroke-width="3"/>
<text x="461" y="570" text-anchor="start" font-size="28" fill="#04776f" font-weight="700">Product A (1, 2)</text>
<text x="461" y="620" text-anchor="start" font-size="28" fill="#04776f" font-weight="700">Product B (1, 3)</text>
</g>
</svg>
