<text x="261" y="562" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Supported</text>
<text x="416" y="562" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Supported</text>
<text x="571" y="562" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Supported</text>
<text x="26" y="635" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">Use a slide or notes-slide manager for a local change.</text>
<text x="26" y="659" font-size="17" font-weight="normal" text-anchor="start" fill="#40536b">Use the appropriate master/layout propagation methods for dependents.</text>
