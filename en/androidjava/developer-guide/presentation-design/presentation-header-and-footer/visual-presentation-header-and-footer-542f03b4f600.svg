<text x="416" y="407" font-size="17" font-weight="bold" text-anchor="start" fill="#14253d">Footer</text>
<text x="571" y="407" font-size="17" font-weight="bold" text-anchor="start" fill="#14253d">Date / number</text>
<text x="42" y="458" font-size="18" font-weight="normal" text-anchor="start" fill="#14253d">Regular slide</text>
<text x="261" y="458" font-size="17" font-weight="normal" text-anchor="start" fill="#b6501e">Not supported</text>
<text x="416" y="458" font-size="17" font-weight="normal" text-anchor="start" fill="#04776f">Supported</text>
