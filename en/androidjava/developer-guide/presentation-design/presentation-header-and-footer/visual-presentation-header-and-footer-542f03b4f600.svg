<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 725">
<title id="title">Choose the manager for the intended scope</title>
<desc id="description">Supported placeholders differ between regular slides, notes and handouts; hierarchy managers can propagate supported settings.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="26" y="35" font-size="23" font-weight="bold" text-anchor="start" fill="#14253d">Choose the manager for the intended scope</text>
<text x="26" y="62" font-size="12" font-weight="normal" text-anchor="start" fill="#40536b">CONCEPTUAL DIAGRAM</text>
<rect x="26" y="95" width="708" height="77" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="42" y="124" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Presentation-wide manager</text>
<text x="42" y="153" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Updates supported placeholders throughout the presentation</text>
<rect x="26" y="218" width="220" height="105" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="42" y="247" font-size="18" font-weight="bold" text-anchor="start" fill="#275eb0">Regular hierarchy</text>
<text x="42" y="276" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Master / layout → slides</text>
<text x="42" y="299" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Supported propagation</text>
<rect x="270" y="218" width="220" height="105" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="286" y="247" font-size="18" font-weight="bold" text-anchor="start" fill="#04776f">Notes hierarchy</text>
<text x="286" y="276" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Notes master → notes</text>
<text x="286" y="299" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Local notes-slide manager</text>
<rect x="514" y="218" width="220" height="105" rx="10" fill="#f0f5fc" stroke="#cedaea" stroke-width="1.5"/>
<text x="530" y="247" font-size="18" font-weight="bold" text-anchor="start" fill="#04776f">Handout master</text>
<text x="530" y="276" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Shared handout layout</text>
<text x="530" y="299" font-size="16" font-weight="normal" text-anchor="start" fill="#40536b">Handout-page settings</text>
