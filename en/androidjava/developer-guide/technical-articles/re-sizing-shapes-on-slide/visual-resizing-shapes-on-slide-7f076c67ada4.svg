<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 760 387">
<title id="title">Scale shape coordinates along each slide axis</title>
<desc id="description">A circle becomes an ellipse on an A4 slide because the horizontal and vertical scale ratios differ. Coordinates and dimensions for both slides are shown in points.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#14253d">
<text x="29" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">Original slide</text>
<text x="29" y="53" font-size="16" font-weight="400" text-anchor="start" fill="#40536b">720 × 405 pt</text>
<image x="29.000" y="71.000" width="280.800" height="157.950" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="29.000" y="71.000" width="280.800" height="157.950" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<rect x="157.700" y="108.050" width="70.200" height="70.200" fill="none" stroke="#04776f" stroke-width="2" stroke-dasharray="5 3" rx="0" opacity="1"/>
<path d="M32.00 108.05L153.70 108.05" fill="none" stroke="#275eb0" stroke-width="2" stroke-dasharray=""/>
<polygon points="153.70,108.05 145.93,112.60 145.93,103.50" fill="#275eb0"/>
<path d="M157.70 73.00L157.70 104.05" fill="none" stroke="#b6501e" stroke-width="2" stroke-dasharray=""/>
<polygon points="157.70,104.05 153.15,96.28 162.25,96.28" fill="#b6501e"/>
<text x="93.35000000000001" y="100.05000000000001" font-size="16" font-weight="700" text-anchor="middle" fill="#275eb0">X</text>
<text x="168.70000000000002" y="92.525" font-size="16" font-weight="700" text-anchor="start" fill="#b6501e">Y</text>
<text x="29" y="304" font-size="17" font-weight="700" text-anchor="start" fill="#275eb0">X 330 pt  ·  Width 180 pt</text>
<text x="29" y="332" font-size="17" font-weight="700" text-anchor="start" fill="#b6501e">Y 95 pt  ·  Height 180 pt</text>
<text x="419" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#14253d">A4 slide</text>
<text x="419" y="53" font-size="16" font-weight="400" text-anchor="start" fill="#40536b">780 × 540 pt</text>
<image x="419.000" y="71.000" width="304.200" height="210.600" preserveAspectRatio="none" href="data:image/png;base64,"/>
<rect x="419.000" y="71.000" width="304.200" height="210.600" fill="none" stroke="#cedaea" stroke-width="2" stroke-dasharray="" rx="0" opacity="1"/>
<rect x="558.425" y="120.400" width="76.050" height="93.600" fill="none" stroke="#04776f" stroke-width="2" stroke-dasharray="5 3" rx="0" opacity="1"/>
<path d="M422.00 120.40L554.42 120.40" fill="none" stroke="#275eb0" stroke-width="2" stroke-dasharray=""/>
<polygon points="554.42,120.40 546.66,124.95 546.66,115.85" fill="#275eb0"/>
<path d="M558.42 73.00L558.42 116.40" fill="none" stroke="#b6501e" stroke-width="2" stroke-dasharray=""/>
<polygon points="558.42,116.40 553.88,108.63 562.97,108.63" fill="#b6501e"/>
<text x="488.7125" y="112.4000013" font-size="16" font-weight="700" text-anchor="middle" fill="#275eb0">X</text>
<text x="569.425" y="98.70000064999999" font-size="16" font-weight="700" text-anchor="start" fill="#b6501e">Y</text>
<text x="419" y="304" font-size="17" font-weight="700" text-anchor="start" fill="#275eb0">X 357.5 pt  ·  Width 195 pt</text>
<text x="419" y="332" font-size="17" font-weight="700" text-anchor="start" fill="#b6501e">Y 126.7 pt  ·  Height 240 pt</text>
<path d="M329.00 173.00L392.00 173.00" fill="none" stroke="#04776f" stroke-width="2" stroke-dasharray=""/>
<polygon points="392.00,173.00 384.23,177.55 384.23,168.45" fill="#04776f"/>
<text x="29" y="371" font-size="17" font-weight="700" text-anchor="start" fill="#275eb0">Width ratio 1.083 scales X and width</text>
<text x="419" y="371" font-size="17" font-weight="700" text-anchor="start" fill="#b6501e">Height ratio 1.333 scales Y and height</text>
</g>
</svg>
